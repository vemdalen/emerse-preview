*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#404040}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;font-family:'AN',Avenir Next,Avenir,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:block;text-decoration:none}
.photo{position:absolute;background-size:cover;background-position:center;overflow:hidden}
.photo i{position:absolute;inset:0;background:#404040;transform-origin:right center;transform:scaleX(1);animation:wipe .9s cubic-bezier(.7,0,.3,1) .1s forwards}
@keyframes wipe{to{transform:scaleX(0)}}
.dark{position:absolute;background:#404040;color:#fff}
.pink{position:absolute;background:#FF426F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.logo{display:block}
.frame{position:absolute;padding:inherit;inset:0;opacity:0;pointer-events:none;display:flex;flex-direction:column;justify-content:center}
.frame>*{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.frame.on{opacity:1}
.frame.on>*{opacity:1;transform:none}
.frame.on>*:nth-child(1){transition-delay:0s}.frame.on>*:nth-child(2){transition-delay:.15s}.frame.on>*:nth-child(3){transition-delay:.3s}.frame.on>*:nth-child(4){transition-delay:.45s}.frame.on>*:nth-child(5){transition-delay:.6s}
.frame.off>*{opacity:0;transform:translateY(-8px);transition:opacity .35s ease,transform .35s ease}
.over{font-weight:700;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;color:#fff;line-height:1.2}
.hl{font-weight:700;text-transform:uppercase;line-height:1.1;color:#fff;position:relative}
.sub{line-height:1.35}
.hl .arr{position:absolute;display:block}
.sub{font-style:italic;font-weight:400;color:#fff}
.box{display:inline-block;background:#FF426F;color:#fff;font-weight:700;text-transform:uppercase;line-height:1;transform:rotate(-1deg);transform-origin:left bottom}
.box.w{background:#fff;color:#FF426F}
.start{font-weight:700;color:#fff;text-align:center;white-space:nowrap}
.cta{display:flex;align-items:center;justify-content:center;background:#fff;color:#404040;font-weight:700;text-transform:uppercase;white-space:nowrap}
.cta svg{display:block}
.cta.pulse{animation:pulse 1.1s ease-in-out 3}
